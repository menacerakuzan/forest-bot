[project]
name = "forest-bot"
version = "1.0.0"
description = "Лісова порадниця — Telegram-бот, що відповідає на питання звірів за документами з порадами"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "asyncpg>=0.30",
    "groq>=0.11",
    "pillow>=13.0.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.1",
    "tzdata>=2024.1",
]

[project.scripts]
forest-bot = "forest_bot.__main__:run"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forest_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кирилиця в рядках — це норма

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
