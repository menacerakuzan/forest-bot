name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tesseract for OCR tests
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ukr
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config --quiet
        env:
          TELEGRAM_BOT_TOKEN: ci
          GROQ_API_KEY: ci
      - run: docker build -t forest-bot .
